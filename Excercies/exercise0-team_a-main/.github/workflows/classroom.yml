name: Autograding Tests
on:
  push:
  workflow_dispatch:
  repository_dispatch:
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Run test for task_b_1
      id: test_task_b_1
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: 'Test for Task B1'
        setup-command: sudo -H pip3 install pytest matplotlib numpy scipy
        command: pytest -k 'test_task_b_1'
        timeout: 2
        max-score: 1
    - name: Run test for task_b_2
      id: test_task_b_2
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: 'Test for Task B2'
        setup-command: sudo -H pip3 install pytest matplotlib numpy scipy
        command: pytest -k 'test_task_b_2'
        timeout: 1
        max-score: 1
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TEST_TASK_B_1_RESULTS: "${{ steps.test_task_b_1.outputs.result }}"
        TEST_TASK_B_2_RESULTS: "${{ steps.test_task_b_2.outputs.result }}"
      with:
        runners: test_task_b_1,test_task_b_2
